name: News Signal Bot

on:
  schedule:
    - cron: "0 */6 * * *"     # restart every 6 hours
  workflow_dispatch:           # lets you start it manually

# Never run two copies at once; queue the next one instead
concurrency:
  group: news-bot
  cancel-in-progress: false

# Needed so the bot can save its state file back to the repo
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_state.json || true
          git diff --cached --quiet || (git commit -m "update bot state" && git pull --rebase --autostash && git push)
